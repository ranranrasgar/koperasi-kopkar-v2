//apply plugin: 'com.android.application'
apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    compileSdk 36

    defaultConfig {
        applicationId 'com.rhansoft.kopkarmjsjkt2000'
        minSdk 24
        targetSdk 36
        multiDexEnabled true

        versionCode 22041
        versionName '2.2041'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

























    // Kunci penandatanganan release dibaca dari keystore.properties di folder proyek (tidak ikut git), isinya:
    //   storeFile=kopkarmattel2026.jks   (relatif terhadap folder proyek, atau jalur lengkap)
    //   storePassword=...
    //   keyAlias=kopkarmattel2026
    //   keyPassword=...
    // Tanpa berkas itu build debug tetap jalan; build release gagal karena belum ditandatangani.
    def kunciProps = new Properties()
    def kunciFile = rootProject.file('keystore.properties')
    if (kunciFile.exists()) kunciFile.withInputStream { kunciProps.load(it) }

    signingConfigs {
        config {
            if (kunciFile.exists()) {
                keyAlias kunciProps['keyAlias']
                keyPassword kunciProps['keyPassword']
                storeFile rootProject.file(kunciProps['storeFile'])
                storePassword kunciProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    ndkVersion '28.0.12674561'

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    dependenciesInfo {
        includeInBundle false
        includeInApk false
    }


    namespace 'com.rhansoft.kopkarmjsjkt2000'
    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'MissingTranslation'
    }
}

dependencies {
    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.10.0')
//    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-auth'

    // AndroidX & UI
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.annotation:annotation:1.9.1'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment:2.8.5'
    implementation 'androidx.navigation:navigation-ui:2.8.5'

    // Networking & Utils
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.google.guava:guava:31.1-android'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // QR Scanner & CameraX
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'androidx.test:monitor:1.7.2'
}
